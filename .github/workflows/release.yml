name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: v8.0-ar1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build unsigned release APK (fdroid flavor)
        run: ./gradlew assembleFdroidRelease --no-daemon --no-configuration-cache

      - name: Verify APK is unsigned
        run: |
          APK=$(find app/build/outputs/apk -name "*fdroid*release*.apk" | head -1)
          echo "APK path: $APK"
          if [ -z "$APK" ]; then echo "APK not found"; find app/build/outputs/apk -type f; exit 1; fi
          SIGS=$(unzip -l "$APK" | grep -cE 'META-INF/.+\.(RSA|DSA|EC|SF)' || true)
          echo "signature files: $SIGS"
          if [ "$SIGS" -ne 0 ]; then echo "APK is signed - refusing to ship"; exit 1; fi
          cp "$APK" "PackageManager-${{ env.VERSION }}-unsigned.apk"

      - name: Create source ZIP
        run: git archive --format=zip HEAD -o "PackageManager-${{ env.VERSION }}-source.zip"

      - name: Delete previous releases and tags (keep only latest)
        run: |
          gh release list --limit 50 --json tagName,isDraft --jq '.[] | select(.isDraft==false) | .tagName' | while read -r tag; do
            if [ "$tag" != "${{ env.VERSION }}" ]; then
              gh release delete "$tag" --yes || true
              git push origin ":refs/tags/$tag" || true
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          gh release create "${{ env.VERSION }}" \
            "PackageManager-${{ env.VERSION }}-unsigned.apk" \
            "PackageManager-${{ env.VERSION }}-source.zip" \
            --title "Package Manager ${{ env.VERSION }}" \
            --notes "Unsigned release APK + modified source ZIP (v8.0-ar1: full Arabic UI, ar+en only, developer/about sections removed, fdroid flavor)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
